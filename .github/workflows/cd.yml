name: CD

on:
  push:
    branches: [main]

# Nunca cancela: cada push na main deve gerar seu deploy
concurrency:
  group: cd-main
  cancel-in-progress: false

jobs:
  ci:
    uses: ./.github/workflows/ci.yml

  deploy:
    needs: ci
    runs-on: ubuntu-latest
    steps:
      - name: Trigger Render deploy hook
        env:
          RENDER_HOOK: ${{ secrets.RENDER_HOOK }}
        run: |
          if [ -z "$RENDER_HOOK" ]; then
            echo "RENDER_HOOK secret is not set" >&2
            exit 1
          fi
          curl --fail --silent --show-error -X POST "$RENDER_HOOK"
